<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Broong, Inc. — publisher of Beyo, AI Countdown.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <title>Broong, Inc.</title>
</head>
<body class="home">
  <main class="poster">
    <img
      class="poster-title"
      src="/assets/images/site_title@2x.png"
      width="760"
      height="168"
      alt="Beyo, AI Countdown"
      decoding="async"
    >

    <div class="poster-shots" aria-label="App screenshots">
      <img
        src="/assets/images/image01@2x.png"
        width="270"
        height="587"
        alt="Beyo app screenshot 1"
        decoding="async"
      >
      <img
        src="/assets/images/image02@2x.png"
        width="270"
        height="587"
        alt="Beyo app screenshot 2"
        decoding="async"
      >
      <img
        src="/assets/images/image03@2x.png"
        width="270"
        height="587"
        alt="Beyo app screenshot 3"
        decoding="async"
      >
      <img
        src="/assets/images/image04@2x.png"
        width="270"
        height="587"
        alt="Beyo app screenshot 4"
        decoding="async"
      >
    </div>

    <a
      class="poster-icon-link"
      href="https://apps.apple.com/app/beyo/id1397284424"
      aria-label="Download on the App Store"
    >
      <img
        class="poster-icon"
        src="/assets/images/app_icon@2x.png"
        width="90"
        height="90"
        alt="Beyo app icon"
        decoding="async"
      >
    </a>

    <a
      class="poster-badge"
      href="https://apps.apple.com/app/beyo/id1397284424"
      aria-label="Download on the App Store"
    >
      <img
        src="/assets/images/appstore.svg"
        width="120"
        height="40"
        alt=""
        decoding="async"
      >
    </a>

    <img
      class="poster-copy"
      src="/assets/images/allrightsreserved@2x.png"
      width="370"
      height="21"
      alt="© 2026 Broong Inc. All rights reserved."
      decoding="async"
    >

    <a class="poster-email" href="#" aria-label="Email" id="poster-email">
      <img
        src="/assets/images/email@2x.png"
        width="38"
        height="26"
        alt=""
        decoding="async"
      >
    </a>
  </main>
  <script>
    (function () {
      var el = document.getElementById("poster-email");
      if (!el) return;
      el.addEventListener("click", function (e) {
        e.preventDefault();
        window.location.href = "mailto:" + "info" + "@" + "broong.com";
      });
    })();
  </script>
</body>
</html>
